spring:
  application:
    name: booking-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/bookingdb
    username: ${DB_USER:booking_user}
    password: ${DB_PASSWORD:booking_pw}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema. Hibernate only checks it.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8083}
  error:
    include-message: never   # Errors go out as RFC 9457, never as Spring's default body

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}/v1/traces
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}/v1/traces

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${spring.application.name},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

# Downstream services are reached by URL from the environment. docker-compose
# provides the DNS names; there is no service discovery at stage 0 and none is
# needed for four services.
clients:
  inventory:
    base-url: ${INVENTORY_URL:http://localhost:8082}
    connect-timeout-ms: 500
    read-timeout-ms: 2000
  schedule:
    base-url: ${SCHEDULE_URL:http://localhost:8081}
    connect-timeout-ms: 500
    read-timeout-ms: 1000
  quota:
    base-url: ${QUOTA_URL:http://localhost:8086}
    connect-timeout-ms: 300
    read-timeout-ms: 800
  fare:
    base-url: ${FARE_URL:http://localhost:8087}
    connect-timeout-ms: 500
    read-timeout-ms: 1000

# Stage 3: timeouts decreasing inward (gateway 8s > booking 5s > inventory 2s > DB 500ms)
spring.datasource.hikari.connection-timeout: 500
server.tomcat.connection-timeout: 5000

# Stage 3: circuit breaker on the inventory call, added after baseline.md §3
# showed booking hanging for the full 2s read-timeout on every single request
# while inventory struggles. Once >=50% of the last 10 calls fail or run
# slower than 1s (still under the 2s hard timeout), the breaker opens and
# every call short-circuits to InventoryGateway's fallback in <50ms instead
# of retrying the network.
#
# No `register-health-indicator` here: resilience4j-spring-boot3 2.3.0 predates
# Spring Boot 4's actuate.health package rename, so its health/metrics
# integration silently no-ops on Boot 4.1 (verified: /actuator/health never
# gains a circuitBreakers component, /actuator/prometheus never gains
# resilience4j_circuitbreaker_* series). CircuitBreakerStateLogger below is the
# visibility we actually have until an upstream release supports Boot 4.
resilience4j:
  circuitbreaker:
    instances:
      inventory:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 1000ms
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      quota:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 800ms
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # 4xx are business errors (e.g. 409 quota exceeded), not infrastructure
        # failures. Ignore them so they don't trip the circuit breaker — the
        # fallback still handles them for correct business logic.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

# The producer/consumer (de)serializer is set in config/KafkaConfig.java, not
# here: that @Bean-defined ProducerFactory/ConsumerFactory replaces Spring
# Boot's autoconfigured Kafka beans entirely, so any spring.kafka.producer.*/
# consumer.* property here would be silently ignored.
spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

booking:
  payment:
    # Stage 0 payment is a coin flip inside this service. payment-service
    # becomes real at stage 5, when it has a third party to wait for.
    mock-success-rate: 0.9
  expiry:
    sweep-interval-ms: 30000   # Stage 5: sweep PENDING_PAYMENT bookings past expiresAt every 30s
