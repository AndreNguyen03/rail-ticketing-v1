spring:
  application:
    name: api-gateway

  threads:
    virtual:
      enabled: true

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Most specific first — /api/v1/trips/*/availability belongs to inventory,
            # NOT schedule. Must be declared before the broad /api/v1/trips/** route.
            - id: inventory-availability
              uri: ${INVENTORY_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/trips/*/availability

            - id: inventory-holds
              uri: ${INVENTORY_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/holds/**

            - id: booking
              uri: ${BOOKING_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/bookings/**

            # Broad catch-all last — would swallow /trips/*/availability if placed first
            - id: schedule
              uri: ${SCHEDULE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/trips/**

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
  tomcat:
    connection-timeout: 8000
    threads:
      max: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}/v1/traces
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}/v1/traces

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${spring.application.name},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
