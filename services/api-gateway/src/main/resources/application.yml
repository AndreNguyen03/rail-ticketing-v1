spring:
  application:
    name: api-gateway

  threads:
    virtual:
      enabled: true

  # Stage 8: validate Keycloak-issued JWTs. Only jwks-uri is configured (no
  # issuer-uri) so Spring Security validates token signatures but skips issuer
  # claim comparison. This avoids the host/container URL mismatch in dev where
  # clients hit localhost:8180 but the gateway reaches keycloak:8080.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwks-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/rail-ticketing/protocol/openid-connect/certs}

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Most specific first — /api/v1/trips/*/availability belongs to inventory,
            # NOT schedule. Must be declared before the broad /api/v1/trips/** route.
            - id: inventory-availability
              uri: ${INVENTORY_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/trips/*/availability

            - id: inventory-holds
              uri: ${INVENTORY_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/holds/**

            - id: booking
              uri: ${BOOKING_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/bookings/**

            # Broad catch-all last — would swallow /trips/*/availability if placed first
            - id: schedule
              uri: ${SCHEDULE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/trips/**

clients:
  waiting-room:
    base-url: ${WAITING_ROOM_URL:http://localhost:8085}
    connect-timeout-ms: 300
    read-timeout-ms: 300

# Stage 6: tắt mặc định (như INVENTORY_REDIS_ENABLED bên inventory-service) —
# chỉ bật khi load test cho thấy front-door thật sự cần chặn (docs/05 §9 entry
# condition), không bật sẵn cho traffic bình thường.
queue:
  enforcement:
    enabled: ${QUEUE_ENFORCEMENT_ENABLED:false}
    protected-prefixes: /api/v1/holds,/api/v1/bookings

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
  tomcat:
    connection-timeout: 8000
    threads:
      max: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}/v1/traces
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}/v1/traces

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${spring.application.name},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
