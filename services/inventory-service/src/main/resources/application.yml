spring:
  application:
    name: inventory-service

  # Virtual threads: this service is I/O bound and spends its time waiting on
  # Postgres row locks. Platform threads would cap concurrency at the pool size.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/inventorydb
    username: ${DB_USER:inventory_user}
    password: ${DB_PASSWORD:inventory_pw}
    hikari:
      maximum-pool-size: 10
      # Deliberately small. Stage 2 measures what happens when many threads
      # contend for the same rows; a large pool would hide the effect.

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema. Hibernate only checks it.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: never   # Errors go out as RFC 9457, never as Spring's default body

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}/v1/traces
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}/v1/traces

clients:
  schedule:
    base-url: ${SCHEDULE_URL:http://localhost:8081}
    connect-timeout-ms: 500
    read-timeout-ms: 1000

spring.data.redis.host: ${REDIS_HOST:localhost}
spring.data.redis.port: ${REDIS_PORT:6379}
spring.data.redis.timeout: 500ms
spring.data.redis.lettuce.pool.max-active: 20
spring.datasource.hikari.connection-timeout: 500
server.tomcat.connection-timeout: 2000

inventory.redis.enabled: ${INVENTORY_REDIS_ENABLED:false}

inventory:
  hold:
    ttl-seconds: 900          # 15 minutes. The TTL is what makes naive
                              # compensation safe at stage 0 (ADR-0003 context).
    sweep-interval-ms: 30000  # @Scheduled expiry sweep. Distributed timers are
                              # a stage 4 problem.

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${spring.application.name},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
