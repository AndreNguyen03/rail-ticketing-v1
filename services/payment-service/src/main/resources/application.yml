spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  # config/KafkaConfig.java defines its own ProducerFactory/ConsumerFactory beans,
  # which replace Spring Boot's autoconfigured Kafka beans entirely — so only
  # bootstrap-servers here has any effect; consumer/producer.* below would be
  # silently ignored (kept previously only because they happened to match the
  # Java config's own hardcoded String (de)serializers).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: 8084
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${spring.application.name},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
payment:
  mock-success-rate: 0.9
