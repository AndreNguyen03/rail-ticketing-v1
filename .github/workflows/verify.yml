name: invariants

on:
  push:
    branches: [main]
  pull_request:

# One run at a time per branch — cancel in-flight runs on new push.
concurrency:
  group: invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Load test + invariant check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build all service images
        run: docker compose build

      # ── Infrastructure ───────────────────────────────────────────────────────
      - name: Start postgres
        run: docker compose up -d postgres

      - name: Wait for postgres
        run: |
          timeout 30 bash -c \
            'until docker compose exec -T postgres pg_isready -U postgres; do sleep 2; done'

      # ── Services ─────────────────────────────────────────────────────────────
      - name: Start all services
        run: docker compose --profile services up -d

      - name: Wait for services to be healthy
        run: |
          for spec in "schedule-service:8081" "inventory-service:8082" "booking-service:8083" "api-gateway:8080"; do
            svc="${spec%%:*}"
            port="${spec##*:}"
            echo "Waiting for $svc …"
            timeout 120 bash -c \
              "until curl -sf http://localhost:${port}/actuator/health | grep -q '\"status\":\"UP\"'; do sleep 3; done"
            echo "  $svc is UP"
          done

      # ── k6 load test ─────────────────────────────────────────────────────────
      - name: Install k6
        run: |
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6

      - name: Run hold-contention load test
        run: |
          k6 run \
            --env GATEWAY_URL=http://localhost:8080 \
            --env TRIP_ID=1 \
            --env VUS=50 \
            --env DURATION=30s \
            loadtest/k6/hold-contention.js

      # ── Invariant check ───────────────────────────────────────────────────────
      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Run invariant check
        run: |
          chmod +x tools/verify/verify.sh
          ./tools/verify/verify.sh
        env:
          BOOKING_DB_URL: postgresql://booking_user:booking_pw@localhost:5432/bookingdb
          INVENTORY_DB_URL: postgresql://inventory_user:inventory_pw@localhost:5432/inventorydb

      # ── Diagnostics (always run so failures are debuggable) ──────────────────
      - name: Dump service logs on failure
        if: failure()
        run: docker compose --profile services logs --no-color --tail=100
