# Local development fixture (ADR-0008). Kubernetes replaces this at stage 10.
#
# No restart policy anywhere on purpose: stages 4 and 11 kill infrastructure
# deliberately (`docker kill ...`) to observe failure. `unless-stopped` would
# silently restart the container and destroy the experiment.
#
# The four services live behind a `services` profile so that
# `docker compose up -d postgres` still starts the database alone, which is what
# you want while developing one service from the IDE.
#
# Observability stack (Jaeger, Prometheus, Grafana) also lives under the
# `services` profile: tracing and metrics are only meaningful when the full
# application is running.

services:

  postgres:
    image: postgres:16-alpine
    container_name: rt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: [services]
    image: redis:7-alpine
    container_name: rt-redis
    ports:
      - "6379:6379"   # lets a host-run `java -jar` (dev loop, no container build) reach Redis
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    profiles: [services]
    image: apache/kafka:3.7.0
    container_name: rt-kafka
    ports:
      - "29092:29092"   # EXTERNAL listener — lets a host-run `java -jar` (dev loop, no
                         # container build) reach Kafka. `kafka:9092` stays internal-only,
                         # unchanged for container-to-container traffic.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Dev tools ─────────────────────────────────────────────────────────────

  swagger-ui:
    profiles: [services]
    image: swaggerapi/swagger-ui:latest
    container_name: rt-swagger
    ports:
      - "8088:8080"   # Swagger UI → http://localhost:8088
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
      BASE_URL: /
    volumes:
      - ./contracts:/openapi:ro



  redisinsight:
    profiles: [services]
    image: redis/redisinsight:latest
    container_name: rt-redisinsight
    ports:
      - "5540:5540"   # RedisInsight UI → http://localhost:5540
    depends_on:
      redis:
        condition: service_healthy

  kafka-ui:
    profiles: [services]
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: rt-kafka-ui
    ports:
      - "8090:8080"   # Kafka UI → http://localhost:8090
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ── Observability ──────────────────────────────────────────────────────────

  jaeger:
    profiles: [services]
    image: jaegertracing/all-in-one:latest
    container_name: rt-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI  →  http://localhost:16686
      - "4318:4318"     # OTLP HTTP  (services push traces here)

  prometheus:
    profiles: [services]
    image: prom/prometheus:latest
    container_name: rt-prometheus
    ports:
      - "9090:9090"     # Prometheus UI  →  http://localhost:9090
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - jaeger

  grafana:
    profiles: [services]
    image: grafana/grafana:latest
    container_name: rt-grafana
    ports:
      - "3000:3000"     # Grafana UI  →  http://localhost:3000  (admin/admin)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ── Application services ───────────────────────────────────────────────────

  api-gateway:
    profiles: [services]
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: rt-gateway
    ports:
      - "8080:8080"
    environment:
      SCHEDULE_URL: http://schedule-service:8081
      INVENTORY_URL: http://inventory-service:8082
      BOOKING_URL: http://booking-service:8083
      WAITING_ROOM_URL: http://waiting-room:8085
      QUEUE_ENFORCEMENT_ENABLED: "true"
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      - schedule-service
      - inventory-service
      - booking-service
      - jaeger

  schedule-service:
    profiles: [services]
    build:
      context: .
      dockerfile: services/schedule-service/Dockerfile
    container_name: rt-schedule
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: schedule_user
      DB_PASSWORD: schedule_pw
      OTEL_SERVICE_NAME: schedule-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  inventory-service:
    profiles: [services]
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    expose:
      - "8082"
    # container_name and host port removed to allow `docker compose --scale inventory-service=N`
    # (fixed name + fixed 8082:8082 blocks scaling). Gateway reaches it via
    # http://inventory-service:8082 over the internal network. For host debug:
    # docker compose run --publish 8082:8082 inventory-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: inventory_user
      DB_PASSWORD: inventory_pw
      SCHEDULE_URL: http://schedule-service:8081
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      INVENTORY_REDIS_ENABLED: "true"
      OTEL_SERVICE_NAME: inventory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      jaeger:
        condition: service_started

  booking-service:
    profiles: [services]
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    container_name: rt-booking
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: booking_user
      DB_PASSWORD: booking_pw
      INVENTORY_URL: http://inventory-service:8082
      SCHEDULE_URL: http://schedule-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_SERVICE_NAME: booking-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started

  payment-service:
    profiles: [services]
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: rt-payment
    ports:
      - "8084:8084"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_SERVICE_NAME: payment-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started

  waiting-room:
    profiles: [services]
    build:
      context: .
      dockerfile: services/waiting-room/Dockerfile
    container_name: rt-waiting-room
    ports:
      - "8085:8085"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RELEASE_RATE: "50"
      RELEASE_INTERVAL_MS: "500"
      OTEL_SERVICE_NAME: waiting-room
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

volumes:
  pgdata:
  grafana-data:
