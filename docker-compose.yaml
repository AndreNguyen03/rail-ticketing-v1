# Local development fixture (ADR-0008). Kubernetes replaces this at stage 10.
#
# No restart policy anywhere on purpose: stages 4 and 11 kill infrastructure
# deliberately (`docker kill ...`) to observe failure. `unless-stopped` would
# silently restart the container and destroy the experiment.
#
# The four services live behind a `services` profile so that
# `docker compose up -d postgres` still starts the database alone, which is what
# you want while developing one service from the IDE.
#
# Observability stack (Jaeger, Prometheus, Grafana) also lives under the
# `services` profile: tracing and metrics are only meaningful when the full
# application is running.

services:

  postgres:
    image: postgres:16-alpine
    container_name: rt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Observability ──────────────────────────────────────────────────────────

  jaeger:
    profiles: [services]
    image: jaegertracing/all-in-one:latest
    container_name: rt-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI  →  http://localhost:16686
      - "4318:4318"     # OTLP HTTP  (services push traces here)

  prometheus:
    profiles: [services]
    image: prom/prometheus:latest
    container_name: rt-prometheus
    ports:
      - "9090:9090"     # Prometheus UI  →  http://localhost:9090
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - jaeger

  grafana:
    profiles: [services]
    image: grafana/grafana:latest
    container_name: rt-grafana
    ports:
      - "3000:3000"     # Grafana UI  →  http://localhost:3000  (admin/admin)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ── Application services ───────────────────────────────────────────────────

  api-gateway:
    profiles: [services]
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: rt-gateway
    ports:
      - "8080:8080"
    environment:
      SCHEDULE_URL: http://schedule-service:8081
      INVENTORY_URL: http://inventory-service:8082
      BOOKING_URL: http://booking-service:8083
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      - schedule-service
      - inventory-service
      - booking-service
      - jaeger

  schedule-service:
    profiles: [services]
    build:
      context: .
      dockerfile: services/schedule-service/Dockerfile
    container_name: rt-schedule
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: schedule_user
      DB_PASSWORD: schedule_pw
      OTEL_SERVICE_NAME: schedule-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  inventory-service:
    profiles: [services]
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: rt-inventory
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: inventory_user
      DB_PASSWORD: inventory_pw
      SCHEDULE_URL: http://schedule-service:8081
      OTEL_SERVICE_NAME: inventory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  booking-service:
    profiles: [services]
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    container_name: rt-booking
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: booking_user
      DB_PASSWORD: booking_pw
      INVENTORY_URL: http://inventory-service:8082
      SCHEDULE_URL: http://schedule-service:8081
      OTEL_SERVICE_NAME: booking-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

volumes:
  pgdata:
  grafana-data:
